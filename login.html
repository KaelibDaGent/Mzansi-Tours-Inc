<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Mzansi Tours Inc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles/general.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, rgba(0, 34, 68, 0.92) 0%, rgba(0, 122, 61, 0.88) 100%),
                url('https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
            padding: 2rem 1rem;
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-logo i {
            color: var(--sa-gold);
            font-size: 1.8rem;
        }

        .auth-logo span {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-left: 0.5rem;
        }

        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--sa-gold);
            box-shadow: 0 0 0 3px rgba(234, 170, 0, 0.15);
        }

        .form-group input.field-error {
            border-color: #ef4444;
        }

        .field-error-msg {
            font-size: 0.8rem;
            color: #ef4444;
            font-weight: 600;
            margin-top: 0.35rem;
            display: none;
        }

        .field-error-msg.visible {
            display: block;
        }

        .btn-submit-auth {
            width: 100%;
            background: linear-gradient(135deg, var(--sa-green), var(--sa-green-hover));
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-submit-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 122, 61, 0.35);
        }

        .btn-submit-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer-link {
            text-align: center;
            margin-top: 1.3rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer-link a {
            color: var(--sa-green);
            font-weight: 700;
            text-decoration: none;
        }

        .form-status {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            display: none;
        }

        .form-status.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .form-status.success {
            display: block;
            background: rgba(0, 122, 61, 0.1);
            color: var(--sa-green);
        }

        @media (max-width: 480px) {
            .auth-card { padding: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-compass"></i><span>Mzansi Tours</span></div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to continue your Mzansi adventure</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="emailInput">Email</label>
                <input type="email" id="emailInput" required>
                <div class="field-error-msg" id="emailError">Enter a valid email address.</div>
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" required>
                <div class="field-error-msg" id="passwordError">Enter your password.</div>
            </div>

            <button type="submit" class="btn-submit-auth" id="submitBtn">Log In</button>
            <div class="form-status" id="formStatus"></div>
        </form>

        <p class="auth-footer-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="Scripts/supabaseClient.js"></script>
    <script src="Scripts/notify.js"></script>
    <script>
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitBtn');
        const formStatus = document.getElementById('formStatus');

        function showFieldError(input, errorEl, message) {
            input.classList.add('field-error');
            if (message) errorEl.textContent = message;
            errorEl.classList.add('visible');
        }

        function clearFieldError(input, errorEl) {
            input.classList.remove('field-error');
            errorEl.classList.remove('visible');
        }

        function clearAllErrors() {
            clearFieldError(emailInput, document.getElementById('emailError'));
            clearFieldError(passwordInput, document.getElementById('passwordError'));
            formStatus.className = 'form-status';
            formStatus.textContent = '';
        }

        function validateForm() {
            clearAllErrors();
            let valid = true;

            if (!emailInput.value.trim() || !emailInput.value.includes('@')) {
                showFieldError(emailInput, document.getElementById('emailError'));
                valid = false;
            }
            if (!passwordInput.value) {
                showFieldError(passwordInput, document.getElementById('passwordError'));
                valid = false;
            }

            return valid;
        }

        // Maps common Supabase auth error messages to clearer,
        // field-targeted messages instead of a generic popup.
        function handleAuthError(error) {
            const msg = (error.message || '').toLowerCase();

            if (msg.includes('invalid login credentials')) {
                showFieldError(emailInput, document.getElementById('emailError'), ' ');
                showFieldError(passwordInput, document.getElementById('passwordError'), 'Incorrect email or password.');
                formStatus.className = 'form-status error';
                formStatus.textContent = 'We couldn\'t log you in — check your email and password and try again.';
                return;
            }

            if (msg.includes('email not confirmed')) {
                formStatus.className = 'form-status error';
                formStatus.textContent = 'Please confirm your email address before logging in — check your inbox for the confirmation link.';
                return;
            }

            formStatus.className = 'form-status error';
            formStatus.textContent = error.message;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateForm()) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
                handleAuthError(error);
                return;
            }

            // Look up the user's role to decide where to send them.
            // Role values match the Postgres enum exactly: tourist / business / admin
            const { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', data.user.id)
                .single();

            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';

            if (profileError) {
                formStatus.className = 'form-status error';
                formStatus.textContent = 'Logged in, but could not load your profile: ' + profileError.message;
                return;
            }

            localStorage.setItem('currentUserEmail', data.user.email);

            switch (profile.role) {
                case 'admin':
                    window.location.href = 'admin.html';
                    break;
                case 'business_owner':
                    window.location.href = 'business-dashboard.html';
                    break;
                default:
                    window.location.href = 'Dashboard.html';
            }
        });
    </script>
</body>
</html>
