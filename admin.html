<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Mzansi Tours Inc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/general.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .admin-header h1 { font-size: 1.8rem; font-weight: 800; }
    .btn-logout { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
    .tab-btn { padding: 0.7rem 1.2rem; font-weight: 700; color: var(--text-muted); border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--sa-green); border-bottom-color: var(--sa-green); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .review-card, .post-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1rem; display: flex; gap: 1rem; }
    .post-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .card-body { flex: 1; }
    .card-title { font-weight: 700; margin-bottom: 0.3rem; }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .card-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
    .btn-approve { background: #16a34a; color: white; padding: 0.4rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
    .btn-reject { background: #dc2626; color: white; padding: 0.4rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
    .review-body { font-size: 0.9rem; margin-bottom: 0.5rem; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .status-badge { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-rejected { background: #fee2e2; color: #991b1b; }

    /* Reports */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.25rem; text-align: center; }
    .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--sa-green); }
    .stat-card .stat-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.3rem; }
    .report-section-title { font-size: 1rem; font-weight: 700; margin: 1.5rem 0 0.75rem; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden; }
    .report-table th, .report-table td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    .report-table th { color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; background: var(--bg-main); }
    .report-table tr:last-child td { border-bottom: none; }
    .trend-bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .trend-bar-label { width: 90px; font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; }
    .trend-bar-track { flex: 1; background: var(--bg-main); border-radius: 4px; height: 18px; overflow: hidden; }
    .trend-bar-fill { background: var(--sa-green); height: 100%; border-radius: 4px; }
    .trend-bar-count { width: 30px; text-align: right; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
    .btn-download-report { background: var(--sa-green); color: white; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <div class="admin-header">
      <h1>Admin Panel</h1>
      <button class="btn-logout" id="logoutBtn">Log Out</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="posts">Pending Posts <span id="pendingCount"></span></button>
      <button class="tab-btn" data-tab="reviews">Reviews <span id="pendingReviewCount"></span></button>
      <button class="tab-btn" data-tab="reports">Reports</button>
    </div>

    <div class="tab-panel active" id="postsPanel">
      <div id="postsList"><div class="empty-state">Loading...</div></div>
    </div>

    <div class="tab-panel" id="reviewsPanel">
      <div id="reviewsList"><div class="empty-state">Loading...</div></div>
    </div>

    <div class="tab-panel" id="reportsPanel">
      <button type="button" class="btn-download-report" id="downloadReportBtn">
        <i class="fa-solid fa-download"></i> Download Listings CSV
      </button>

      <div class="stats-grid" id="statsGrid">
        <div class="empty-state">Loading stats...</div>
      </div>

      <div class="report-section-title">Itinerary Adds by Month (platform-wide)</div>
      <div class="post-card" id="trendWrap" style="display:block;">
        <div class="empty-state">Loading trend...</div>
      </div>

      <div class="report-section-title">Top Listings by Itinerary Adds</div>
      <div id="topListingsWrap">
        <div class="empty-state">Loading...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="Scripts/supabaseClient.js"></script>
  <script src="Scripts/notify.js"></script>
  <script>
    async function guardAndInit() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }

      const { data: profile, error } = await supabaseClient
        .from('profiles').select('role').eq('id', user.id).single();

      if (error || !profile || profile.role !== 'admin') {
        window.location.href = 'login.html';
        return;
      }

      loadPendingPosts();
      loadReviews();
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab + 'Panel').classList.add('active');

        if (btn.dataset.tab === 'reports' && !reportsLoaded) {
          loadReports();
        }
      });
    });

    // ---------- PENDING BUSINESS POSTS ----------
    async function loadPendingPosts() {
      const listEl = document.getElementById('postsList');
      const { data: posts, error } = await supabaseClient
        .from('business_posts')
        .select('*, profiles(full_name, business_name, email)')
        .eq('status', 'pending')
        .order('created_at', { ascending: true });

      if (error) {
        listEl.innerHTML = `<div class="empty-state">Error: ${error.message}</div>`;
        return;
      }

      document.getElementById('pendingCount').textContent = posts.length ? `(${posts.length})` : '';

      if (!posts.length) {
        listEl.innerHTML = `<div class="empty-state">No pending posts to review.</div>`;
        return;
      }

      listEl.innerHTML = posts.map(p => `
        <div class="post-card">
          ${p.image_url ? `<img src="${p.image_url}" alt="${p.title}">` : ''}
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-meta">${p.province} • ${p.category || 'Uncategorized'} • by ${p.profiles?.business_name || p.profiles?.full_name || p.profiles?.email}</div>
            <div style="font-size:0.9rem; margin-bottom:0.5rem;">${p.description || ''}</div>
            <div class="card-actions">
              <button class="btn-approve" onclick="reviewPost('${p.id}', 'approved')">Approve</button>
              <button class="btn-reject" onclick="rejectPost('${p.id}')">Reject</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function reviewPost(id, status, notes = null) {
      const { error } = await supabaseClient
        .from('business_posts')
        .update({ status, admin_notes: notes, reviewed_at: new Date().toISOString() })
        .eq('id', id);

      if (error) { showToast('Error: ' + error.message, 'error'); return; }
      showToast(status === 'approved' ? 'Post approved.' : 'Post rejected.', 'success');
      loadPendingPosts();
      reportsLoaded = false; // data changed, force refresh next visit
    }

    function rejectPost(id) {
      const reason = prompt('Reason for rejection (optional):');
      reviewPost(id, 'rejected', reason || null);
    }

    // ---------- REVIEW MODERATION ----------
    async function loadReviews() {
      const listEl = document.getElementById('reviewsList');
      const { data: reviews, error } = await supabaseClient
        .from('reviews')
        .select('*, profiles(full_name, email), business_posts(title)')
        .eq('status', 'pending')
        .order('created_at', { ascending: true });

      if (error) {
        listEl.innerHTML = `<div class="empty-state">Error: ${error.message}</div>`;
        return;
      }

      document.getElementById('pendingReviewCount').textContent = reviews.length ? `(${reviews.length})` : '';

      if (!reviews.length) {
        listEl.innerHTML = `<div class="empty-state">No pending reviews to moderate.</div>`;
        return;
      }

      listEl.innerHTML = reviews.map(r => `
        <div class="review-card">
          <div class="card-body">
            <div class="card-title">${r.title}</div>
            <div class="card-meta">${r.province || ''} • ${r.rating}★ • by ${r.profiles?.full_name || r.profiles?.email}${r.business_posts?.title ? ` • for ${r.business_posts.title}` : ''}</div>
            <div class="review-body">${r.body}</div>
            <div class="card-actions">
              <button class="btn-approve" onclick="reviewReview('${r.id}', 'approved')">Approve</button>
              <button class="btn-reject" onclick="rejectReview('${r.id}')">Reject</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function reviewReview(id, status, notes = null) {
      const { error } = await supabaseClient
        .from('reviews')
        .update({ status, admin_notes: notes, reviewed_at: new Date().toISOString() })
        .eq('id', id);

      if (error) { showToast('Error: ' + error.message, 'error'); return; }
      showToast(status === 'approved' ? 'Review approved.' : 'Review rejected.', 'success');
      loadReviews();
      reportsLoaded = false;
    }

    function rejectReview(id) {
      const reason = prompt('Reason for rejection (optional):');
      reviewReview(id, 'rejected', reason || null);
    }

    // ---------- REPORTS (platform-wide) ----------
    let reportsLoaded = false;
    let topListingsData = [];

    async function loadReports() {
      const statsGrid = document.getElementById('statsGrid');
      const trendWrap = document.getElementById('trendWrap');
      const topWrap = document.getElementById('topListingsWrap');

      const [
        { data: profiles },
        { data: posts },
        { data: reviews },
        { data: itineraries }
      ] = await Promise.all([
        supabaseClient.from('profiles').select('role'),
        supabaseClient.from('business_posts').select('id, title, status'),
        supabaseClient.from('reviews').select('status'),
        supabaseClient.from('itineraries').select('event_id, added_at')
      ]);

      // ---- Summary stat cards ----
      const roleCounts = { tourist: 0, business_owner: 0, admin: 0 };
      (profiles || []).forEach(p => { if (roleCounts[p.role] !== undefined) roleCounts[p.role]++; });

      const postStatusCounts = { pending: 0, approved: 0, rejected: 0 };
      (posts || []).forEach(p => { if (postStatusCounts[p.status] !== undefined) postStatusCounts[p.status]++; });

      const reviewStatusCounts = { pending: 0, approved: 0, rejected: 0 };
      (reviews || []).forEach(r => { if (reviewStatusCounts[r.status] !== undefined) reviewStatusCounts[r.status]++; });

      statsGrid.innerHTML = `
        <div class="stat-card"><div class="stat-value">${roleCounts.tourist}</div><div class="stat-label">Tourists</div></div>
        <div class="stat-card"><div class="stat-value">${roleCounts.business_owner}</div><div class="stat-label">Business Owners</div></div>
        <div class="stat-card"><div class="stat-value">${postStatusCounts.approved}</div><div class="stat-label">Approved Listings</div></div>
        <div class="stat-card"><div class="stat-value">${postStatusCounts.pending}</div><div class="stat-label">Pending Listings</div></div>
        <div class="stat-card"><div class="stat-value">${reviewStatusCounts.approved}</div><div class="stat-label">Approved Reviews</div></div>
        <div class="stat-card"><div class="stat-value">${(itineraries || []).length}</div><div class="stat-label">Total Itinerary Adds</div></div>
      `;

      // ---- Monthly trend, platform-wide ----
      const monthCounts = {};
      (itineraries || []).forEach(row => {
        const d = new Date(row.added_at);
        const key = d.toLocaleDateString('en-ZA', { year: 'numeric', month: 'short' });
        monthCounts[key] = (monthCounts[key] || 0) + 1;
      });

      const months = Object.keys(monthCounts).sort((a, b) => new Date(a) - new Date(b));
      const maxCount = Math.max(1, ...Object.values(monthCounts));

      trendWrap.innerHTML = !months.length
        ? `<div class="empty-state">No itinerary adds recorded yet.</div>`
        : months.map(m => `
            <div class="trend-bar-row">
              <span class="trend-bar-label">${m}</span>
              <div class="trend-bar-track">
                <div class="trend-bar-fill" style="width: ${(monthCounts[m] / maxCount) * 100}%;"></div>
              </div>
              <span class="trend-bar-count">${monthCounts[m]}</span>
            </div>
          `).join('');

      // ---- Top listings by itinerary adds ----
      const addsByListing = {};
      (itineraries || []).forEach(row => {
        addsByListing[row.event_id] = (addsByListing[row.event_id] || 0) + 1;
      });

      topListingsData = (posts || [])
        .map(p => ({
          title: p.title,
          status: p.status,
          adds: addsByListing[p.id] || 0
        }))
        .sort((a, b) => b.adds - a.adds)
        .slice(0, 10);

      topWrap.innerHTML = !topListingsData.length
        ? `<div class="empty-state">No listings yet.</div>`
        : `
          <table class="report-table">
            <thead>
              <tr><th>Listing</th><th>Status</th><th>Itinerary Adds</th></tr>
            </thead>
            <tbody>
              ${topListingsData.map(l => `
                <tr>
                  <td>${l.title}</td>
                  <td><span class="status-badge status-${l.status}">${l.status}</span></td>
                  <td>${l.adds}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

      reportsLoaded = true;
    }

    function downloadReportCsv() {
      if (!topListingsData.length) {
        showToast('No data to export yet.', 'info');
        return;
      }

      const headers = ['Listing', 'Status', 'Itinerary Adds'];
      const rows = topListingsData.map(l => [l.title, l.status, l.adds]);

      const csvContent = [headers, ...rows]
        .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `admin-report-${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    document.getElementById('downloadReportBtn').addEventListener('click', downloadReportCsv);

    guardAndInit();
  </script>
</body>
</html>
